<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAJET Music Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <div class="container">
    <!-- Main Screen -->
    <section id="main-screen" class="screen active">
      <header>
        <h1>DAJET Music Player</h1>
        <button id="theme-toggle" aria-label="Switch to light theme">🌙</button>
      </header>

      <main>
        <section class="search-section">
          <label for="search-input" class="sr-only">Search music</label>
          <input type="text" id="search-input" placeholder="Search for songs, artists, albums..." aria-describedby="search-help">
          <span id="search-help" class="sr-only">Type to search through your music library</span>
        </section>

        <section class="albums-section">
          <h2>Your Albums</h2>
          <div id="albums-container" class="albums-grid">
            <!-- Albums will be populated by JS -->
          </div>
        </section>

        <section class="playlist-section">
          <h2>Playlist</h2>
          <div id="playlist-container" class="tracks-list">
            <!-- Tracks will be populated by JS -->
          </div>
        </section>
      </main>
    </section>

    <!-- Album Detail Screen -->
    <section id="album-screen" class="screen">
      <header>
        <button id="back-to-main" aria-label="Back to main screen">←</button>
        <h1 id="album-title">Album Title</h1>
      </header>

      <main>
        <div class="album-info">
          <img id="album-cover" src="" alt="Album cover" class="album-cover">
          <div class="album-details">
            <p id="album-artist">Artist</p>
            <p id="album-year">Year</p>
          </div>
        </div>

        <div id="album-tracks" class="tracks-list">
          <!-- Tracks will be populated by JS -->
        </div>
      </main>
    </section>

    <!-- Search Results Screen -->
    <section id="search-screen" class="screen">
      <header>
        <button id="back-to-main-search" aria-label="Back to main screen">←</button>
        <h1>Search Results</h1>
      </header>

      <main>
        <div id="search-results" class="tracks-list">
          <!-- Search results will be populated by JS -->
        </div>
      </main>
    </section>
  </div>

  <!-- Player Controls -->
  <div class="player-controls" role="region" aria-label="Music player controls">
    <div class="track-info">
      <span id="track-title" aria-live="polite">Select a track</span>
      <span id="track-artist"></span>
    </div>

    <div class="progress-container">
      <span id="current-time">00:00</span>
      <input type="range" id="progress-bar" min="0" max="100" value="0" aria-valuetext="0% played">
      <span id="total-time">00:00</span>
    </div>

    <div class="controls">
      <button id="prev-btn" aria-label="Previous track">⏮</button>
      <button id="play-btn" aria-label="Play">▶</button>
      <button id="next-btn" aria-label="Next track">⏭</button>
    </div>

    <div class="volume-control">
      <label for="volume-slider" class="sr-only">Adjust volume</label>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" aria-label="Volume control">
    </div>
  </div>

  <!-- Loading Spinner -->
  <!-- Visualizer Canvas -->
  <canvas id="visualizer" class="visualizer-canvas"></canvas>

  <div class="loading-spinner" aria-label="Loading" role="status" aria-live="polite" style="display: none;">
    <div class="spinner"></div>
    <span>Loading...</span>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
