<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DAJET - creative memory gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <script src="js/main.js"></script>
</head>
<body>
    <div id="rays-container">
        <canvas id="rays-canvas"></canvas>
    </div>
    <div class="main-container">
        <div class="header">
            <div class="logo">
                <img src="img/logo.png" alt="DAJET Logo">
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search tracks...">
                <button id="search-button">Search</button>
            </div>
        </div>
        <div class="content">
            <div class="sidebar">
                <div class="menu">
                    <ul>
                        <li><a href="#" data-album="all" class="album-link active">All Tracks</a></li>
                        <li><a href="#" data-album="album1" class="album-link">Album 1</a></li>
                        <li><a href="#" data-album="album2" class="album-link">Album 2</a></li>
                        <li><a href="#" data-album="album3" class="album-link">Album 3</a></li>
                        <li><a href="#" data-album="album4" class="album-link">Album 4</a></li>
                        <li><a href="#" data-album="album5" class="album-link">Album 5</a></li>
                        <li><a href="#" data-album="album6" class="album-link">Album 6</a></li>
                    </ul>
                </div>
            </div>
            <div class="tracks-container">
                <div class="tracks-list" id="tracks-list">
                    <!-- Tracks will be loaded here dynamically -->
                </div>
            </div>
        </div>
        <div class="player">
            <div class="track-info">
                <img id="current-track-image" src="" alt="Current Track">
                <div class="track-details">
                    <span id="current-track-title">Select a track</span>
                    <span id="current-track-artist">-</span>
                </div>
            </div>
            <div class="player-controls">
                <button id="prev-btn" class="control-btn">⏮</button>
                <button id="play-btn" class="control-btn">▶</button>
                <button id="pause-btn" class="control-btn">⏸</button>
                <button id="next-btn" class="control-btn">⏭</button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0">
                <span id="total-time">0:00</span>
            </div>
            <div class="volume-control">
                <span>🔈</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
                <span>🔊</span>
            </div>
        </div>
    </div>
</body>
</html>
