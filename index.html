<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAJET Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background container for themes -->
    <div id="theme-background"></div>
    
    <!-- Strobe overlay -->
    <div id="strobe-overlay"></div>

    <div class="container">
        <header class="header">
            <h1>DAJET</h1>
            <p>BEST — Галерея памяти</p>
        </header>

        <div id="search-container">
            <input type="text" id="search-input" placeholder="Поиск альбомов и треков...">
        </div>

        <main>
            <section id="album-grid" class="albums-grid">
                <!-- Albums will be loaded here -->
            </section>

            <section id="album-view" class="album-view">
                <!-- Album tracks will be displayed here -->
            </section>
        </main>
    </div>

    <!-- Player Panel -->
    <div id="player-panel">
        <div class="current-track-info">
            <img id="current-track-image" src="" alt="Current Track" width="60" height="60">
            <div class="current-track-text">
                <div id="current-track-title"></div>
                <div id="current-track-artist"></div>
            </div>
        </div>
        
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" value="0" min="0">
            <span id="total-time">0:00</span>
        </div>
        
        <div class="player-controls">
            <button class="control-btn" id="prev-btn">⏮</button>
            <button class="control-btn" id="play-btn">▶</button>
            <button class="control-btn" id="pause-btn" style="display: none;">⏸</button>
            <button class="control-btn" id="next-btn">⏭</button>
        </div>
        
        <div class="volume-control">
            <span>🔈</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            <span>🔊</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data/albums.js"></script>
    <script src="themes/theme-manager.js"></script>
    <script src="state.js"></script>
    <script src="player.js"></script>
    <script src="ui.js"></script>
    <script src="search.js"></script>
    <script src="visualizer.js"></script>
    <script src="effects-config.js"></script>
    <script src="effects-manager.js"></script>
    <script src="strobe.js"></script>
    <script src="rays.js"></script>
    <script src="script.js"></script>
    <script src="main.js"></script>
</body>
</html>
