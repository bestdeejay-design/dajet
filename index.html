<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DAJET — creative memory gallery. Музыкальная галерея с треками, созданными с помощью Riffusion.">
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <link rel="canonical" href="https://dajet.ru">

    <!-- Open Graph -->
    <meta property="og:title" content="DAJET · creative memory gallery">
    <meta property="og:description" content="Музыкальная галерея с треками, созданными с помощью Riffusion.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dajet.ru">
    <meta property="og:image" content="https://dajet.ru/albums/Album%20Second/cover.jpg">
    <meta property="og:locale" content="ru_RU">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DAJET · creative memory gallery">
    <meta name="twitter:description" content="Музыкальная галерея с треками, созданными с помощью Riffusion.">
    <meta name="twitter:image" content="https://dajet.ru/albums/Album%20Second/cover.jpg">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link rel="manifest" href="manifest.json">

    <title>DAJET · creative memory gallery</title>

    <!-- Preconnect hints -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="player.css">
    <link rel="stylesheet" href="rays.css">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "MusicAlbum",
        "name": "DAJET · creative memory gallery",
        "url": "https://dajet.ru",
        "description": "Музыкальная галерея с треками, созданными с помощью Riffusion.",
        "byArtist": {
            "@type": "Person",
            "name": "BEST"
        }
    }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
        defer
        crossorigin="anonymous"
        integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg==">
    </script>
</head>
<body>
    <div class="background-effects"></div>

    <header class="header">
        <div class="header-row">
            <h1>DAJET</h1>
            <button id="themeToggle" class="theme-toggle"
                title="Сменить тему"
                aria-label="Сменить тему"
                aria-pressed="false">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    <path class="moon" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" style="display: none;"/>
                </svg>
            </button>
        </div>
        <p class="sub">creative memory gallery</p>
    </header>

    <main>
        <section class="gallery" id="gallery" aria-label="Альбомы"></section>
        <div class="loading" id="loading" role="status" aria-live="polite">Загрузка коллекции...</div>
        <div class="error" id="error" role="alert" aria-live="assertive" style="display: none;"></div>
    </main>

    <footer class="site-footer">
        <p>Songs by BEST. All tracks created with <a href="https://riffusion.com" target="_blank" rel="noopener">Riffusion</a>.</p>
        <p>Thanks to the creators of Riffusion for the tools to create.</p>
    </footer>

    <div class="player-bar" id="playerBar" role="region" aria-label="Аудиоплеер">
        <div class="player-main-row">
            <div class="track-info" id="trackInfo">
                <img class="track-cover" id="currentTrackCover" src="" alt="Обложка трека" loading="lazy">
                <div class="track-details">
                    <div class="track-name" id="currentTrackName">Выберите трек</div>
                    <div class="album-name" id="currentAlbumName"></div>
                </div>
            </div>

            <div class="player-center">
                <div class="player-controls">
                    <button class="control-btn" id="prevBtn" title="Предыдущий трек" aria-label="Предыдущий трек">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <button class="control-btn play-pause-btn" id="playPauseBtn" title="Воспроизвести/Пауза" aria-label="Воспроизвести или пауза">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path class="play-icon" d="M8 5v14l11-7z"/>
                            <path class="pause-icon" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" style="display: none;"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="nextBtn" title="Следующий трек" aria-label="Следующий трек">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="shuffleBtn" title="Перемешивать" aria-label="Перемешивать треки">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm0 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="repeatBtn" title="Режим повтора" aria-label="Режим повтора">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                        </svg>
                    </button>
                </div>
                <div class="player-progress" id="progressContainer" role="slider" aria-label="Прогресс трека" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="progress-thumb" id="progressThumb"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="durationTime">0:00</span>
                    </div>
                </div>
            </div>

            <audio id="audioPlayer" preload="metadata"></audio>

            <div class="player-side">
                <div class="volume-control" id="volumeControl">
                    <button class="control-btn volume-btn" id="volumeBtn" title="Регулировка громкости" aria-label="Регулировка громкости">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path class="volume-icon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.49 4.49 0 002.5-3.5zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" aria-label="Громкость" title="Громкость">
                </div>
                <button class="skin-toggle" id="skinToggle" aria-label="Переключить оформление">Classic</button>
                <button class="playlist-toggle" id="togglePlaylist" aria-label="Открыть плейлист" aria-haspopup="true" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 13h12v-2H3v2zm0-6v2h18V7H3zm0 10h6v-2H3v2zm15-3h2v-3h3v-2h-3V7h-2v3h-3v2h3v3z"/>
                    </svg>
                    <span>Плейлист</span>
                </button>
            </div>
        </div>
    </div>

    <div class="playlist-panel" id="playlistPanel" role="dialog" aria-label="Плейлист" aria-hidden="true">
        <div class="playlist-header">
            <h2 id="playlistAlbumTitle">Плейлист</h2>
            <button class="close-panel" id="closePlaylist" aria-label="Закрыть плейлист">&times;</button>
        </div>
        <div id="playlist" role="listbox" aria-label="Список треков"></div>
    </div>
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <script>
        window.__GSAP_LOADED = false;
        document.querySelector('script[src*="gsap"]').addEventListener('load', function() {
            window.__GSAP_LOADED = true;
        });
        document.querySelector('script[src*="gsap"]').addEventListener('error', function() {
            console.warn('GSAP failed to load, animations disabled');
        });
    </script>
    <script src="player.js" defer></script>
    <script src="script.js" defer></script>
    <script src="rays.js" defer></script>
</body>
</html>
