<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Страница не найдена · DAJET</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: #0b0b0b radial-gradient(60% 60% at 50% 0%, rgba(122,162,255,0.18), transparent 70%);
            color: #f0f0f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 2rem;
        }
        h1 { font-size: clamp(3rem, 12vw, 6rem); margin: 0; letter-spacing: 0.15em; }
        p { color: #aaa; margin: 0; max-width: 32rem; }
        a {
            margin-top: 1rem;
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.15);
            color: #f0f0f0;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }
        a:hover, a:focus-visible { border-color: #1db954; color: #1db954; }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Такой страницы нет. Возможно, ссылка устарела или в адресе опечатка.</p>
    <a href="./">Вернуться в галерею</a>
</body>
</html>
