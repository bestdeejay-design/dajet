<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Звёзды с разной интенсивностью мерцания -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Анимации мерцания -->
    <style>
      .star {
        animation: twinkle 3s infinite ease-in-out;
        opacity: 0.3;
      }
      
      .star.twinkle-fast {
        animation: twinkle 1.5s infinite ease-in-out;
        animation-delay: calc(var(--delay) * 1s);
      }
      
      .star.twinkle-medium {
        animation: twinkle 2.5s infinite ease-in-out;
        animation-delay: calc(var(--delay) * 1s);
      }
      
      .star.twinkle-slow {
        animation: twinkle 4s infinite ease-in-out;
        animation-delay: calc(var(--delay) * 1s);
      }
      
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      
      /* Анимация волн/ауры */
      .wave {
        animation: wave-move 20s infinite linear;
        opacity: 0.1;
      }
      
      @keyframes wave-move {
        0% { transform: translateX(-100%) rotate(0deg); }
        100% { transform: translateX(100vw) rotate(360deg); }
      }
      
      /* Анимация частиц */
      .particle {
        animation: particle-drift 15s infinite linear;
        opacity: 0.15;
      }
      
      @keyframes particle-drift {
        0% { 
          transform: translate(0, 0) scale(0.5);
          opacity: 0;
        }
        10% { 
          opacity: 0.5;
        }
        90% { 
          opacity: 0.5;
        }
        100% { 
          transform: translate(calc(100vw - 100%), calc(100vh - 100%)) scale(1);
          opacity: 0;
        }
      }
    </style>
  </defs>
  
  <!-- Градиентный фон -->
  <rect width="100%" height="100%">
    <defs>
      <linearGradient id="space-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#12121a;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
      </linearGradient>
    </defs>
    <fill href="#space-gradient" />
  </rect>
  
  <!-- Волны/аура -->
  <circle cx="20" cy="30" r="40" fill="url(#space-gradient)" class="wave" style="mix-blend-mode: screen;">
    <animate attributeName="r" values="40;60;40" dur="30s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="80" cy="70" r="35" fill="url(#space-gradient)" class="wave" style="mix-blend-mode: screen;">
    <animate attributeName="r" values="35;55;35" dur="25s" repeatCount="indefinite" />
  </circle>
  
  <!-- Звёзды -->
  <circle cx="10" cy="15" r="0.5" fill="white" class="star twinkle-fast" style="--delay: 0.2;" filter="url(#glow)" />
  <circle cx="25" cy="8" r="0.3" fill="white" class="star twinkle-medium" style="--delay: 0.8;" filter="url(#glow)" />
  <circle cx="40" cy="22" r="0.4" fill="white" class="star twinkle-slow" style="--delay: 1.5;" filter="url(#glow)" />
  <circle cx="60" cy="12" r="0.6" fill="white" class="star twinkle-fast" style="--delay: 0.5;" filter="url(#glow)" />
  <circle cx="75" cy="25" r="0.3" fill="white" class="star twinkle-medium" style="--delay: 2.0;" filter="url(#glow)" />
  <circle cx="90" cy="18" r="0.5" fill="white" class="star twinkle-slow" style="--delay: 1.2;" filter="url(#glow)" />
  <circle cx="15" cy="40" r="0.4" fill="white" class="star twinkle-fast" style="--delay: 0.9;" filter="url(#glow)" />
  <circle cx="35" cy="50" r="0.3" fill="white" class="star twinkle-medium" style="--delay: 0.3;" filter="url(#glow)" />
  <circle cx="55" cy="45" r="0.5" fill="white" class="star twinkle-slow" style="--delay: 1.8;" filter="url(#glow)" />
  <circle cx="85" cy="55" r="0.4" fill="white" class="star twinkle-fast" style="--delay: 0.6;" filter="url(#glow)" />
  <circle cx="20" cy="70" r="0.3" fill="white" class="star twinkle-medium" style="--delay: 1.1;" filter="url(#glow)" />
  <circle cx="45" cy="75" r="0.6" fill="white" class="star twinkle-fast" style="--delay: 0.4;" filter="url(#glow)" />
  <circle cx="70" cy="80" r="0.4" fill="white" class="star twinkle-slow" style="--delay: 1.9;" filter="url(#glow)" />
  <circle cx="95" cy="70" r="0.3" fill="white" class="star twinkle-medium" style="--delay: 0.7;" filter="url(#glow)" />
  <circle cx="5" cy="90" r="0.5" fill="white" class="star twinkle-fast" style="--delay: 1.3;" filter="url(#glow)" />
  <circle cx="30" cy="95" r="0.3" fill="white" class="star twinkle-slow" style="--delay: 2.2;" filter="url(#glow)" />
  <circle cx="60" cy="90" r="0.4" fill="white" class="star twinkle-medium" style="--delay: 0.1;" filter="url(#glow)" />
  <circle cx="80" cy="95" r="0.3" fill="white" class="star twinkle-fast" style="--delay: 1.6;" filter="url(#glow)" />
  
  <!-- Фиолетовые звёзды -->
  <circle cx="12" cy="30" r="0.4" fill="#7c4dff" class="star twinkle-medium" style="--delay: 1.0;" filter="url(#glow)" />
  <circle cx="30" cy="35" r="0.3" fill="#7c4dff" class="star twinkle-slow" style="--delay: 0.5;" filter="url(#glow)" />
  <circle cx="50" cy="30" r="0.5" fill="#7c4dff" class="star twinkle-fast" style="--delay: 1.7;" filter="url(#glow)" />
  <circle cx="70" cy="40" r="0.3" fill="#7c4dff" class="star twinkle-medium" style="--delay: 0.9;" filter="url(#glow)" />
  <circle cx="88" cy="35" r="0.4" fill="#7c4dff" class="star twinkle-slow" style="--delay: 1.4;" filter="url(#glow)" />
  <circle cx="25" cy="60" r="0.3" fill="#7c4dff" class="star twinkle-fast" style="--delay: 0.8;" filter="url(#glow)" />
  <circle cx="45" cy="65" r="0.4" fill="#7c4dff" class="star twinkle-medium" style="--delay: 1.1;" filter="url(#glow)" />
  <circle cx="65" cy="60" r="0.3" fill="#7c4dff" class="star twinkle-slow" style="--delay: 0.6;" filter="url(#glow)" />
  <circle cx="85" cy="65" r="0.5" fill="#7c4dff" class="star twinkle-fast" style="--delay: 1.9;" filter="url(#glow)" />
  
  <!-- Циановые звёзды -->
  <circle cx="18" cy="50" r="0.3" fill="#00bcd4" class="star twinkle-slow" style="--delay: 0.4;" filter="url(#glow)" />
  <circle cx="40" cy="55" r="0.4" fill="#00bcd4" class="star twinkle-fast" style="--delay: 1.5;" filter="url(#glow)" />
  <circle cx="60" cy="50" r="0.3" fill="#00bcd4" class="star twinkle-medium" style="--delay: 0.2;" filter="url(#glow)" />
  <circle cx="82" cy="55" r="0.4" fill="#00bcd4" class="star twinkle-slow" style="--delay: 1.8;" filter="url(#glow)" />
  <circle cx="35" cy="85" r="0.3" fill="#00bcd4" class="star twinkle-fast" style="--delay: 1.0;" filter="url(#glow)" />
  <circle cx="55" cy="85" r="0.4" fill="#00bcd4" class="star twinkle-medium" style="--delay: 0.7;" filter="url(#glow)" />
  <circle cx="75" cy="85" r="0.3" fill="#00bcd4" class="star twinkle-slow" style="--delay: 1.3;" filter="url(#glow)" />
  
  <!-- Движущиеся частицы -->
  <circle cx="0" cy="0" r="0.2" fill="rgba(124, 77, 255, 0.5)" class="particle" />
  <circle cx="0" cy="20" r="0.15" fill="rgba(0, 188, 212, 0.5)" class="particle" />
  <circle cx="0" cy="40" r="0.25" fill="rgba(255, 255, 255, 0.3)" class="particle" />
  <circle cx="0" cy="60" r="0.1" fill="rgba(124, 77, 255, 0.4)" class="particle" />
  <circle cx="0" cy="80" r="0.2" fill="rgba(0, 188, 212, 0.4)" class="particle" />
  <circle cx="0" cy="100" r="0.15" fill="rgba(255, 255, 255, 0.2)" class="particle" />
  <circle cx="0" cy="10" r="0.1" fill="rgba(124, 77, 255, 0.3)" class="particle" />
  <circle cx="0" cy="30" r="0.2" fill="rgba(0, 188, 212, 0.3)" class="particle" />
  <circle cx="0" cy="50" r="0.15" fill="rgba(255, 255, 255, 0.4)" class="particle" />
  <circle cx="0" cy="70" r="0.25" fill="rgba(124, 77, 255, 0.5)" class="particle" />
  <circle cx="0" cy="90" r="0.15" fill="rgba(0, 188, 212, 0.5)" class="particle" />
</svg>