<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#0d0705"/>
    </radialGradient>
    
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ffcc5c"/>
    </linearGradient>
    
    <filter id="fireGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Central fire effect -->
  <g id="fire-center">
    <circle cx="50" cy="70" r="8" fill="url(#fireGradient)" opacity="0.4">
      <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="70" r="5" fill="url(#fireGradient)" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.7;0.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="70" r="2.5" fill="#ffcc5c" opacity="0.8">
      <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="1s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Rising sparks -->
  <g id="sparks">
    <!-- Spark 1 -->
    <circle cx="45" cy="75" r="0.3" fill="#ff6b35" opacity="0.8">
      <animate attributeName="cy" values="75;40;20" dur="4s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="cx" values="45;47;45" dur="4s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4s" repeatCount="indefinite" begin="0s" />
    </circle>
    
    <!-- Spark 2 -->
    <circle cx="50" cy="78" r="0.3" fill="#ffb347" opacity="0.8">
      <animate attributeName="cy" values="78;45;25" dur="4.5s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="cx" values="50;48;50" dur="4.5s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4.5s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4.5s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    
    <!-- Spark 3 -->
    <circle cx="55" cy="76" r="0.3" fill="#ffcc5c" opacity="0.8">
      <animate attributeName="cy" values="76;42;22" dur="4.2s" repeatCount="indefinite" begin="0.6s" />
      <animate attributeName="cx" values="55;53;55" dur="4.2s" repeatCount="indefinite" begin="0.6s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4.2s" repeatCount="indefinite" begin="0.6s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4.2s" repeatCount="indefinite" begin="0.6s" />
    </circle>
    
    <!-- Spark 4 -->
    <circle cx="48" cy="79" r="0.3" fill="#ff6b35" opacity="0.8">
      <animate attributeName="cy" values="79;48;28" dur="4.8s" repeatCount="indefinite" begin="0.9s" />
      <animate attributeName="cx" values="48;50;48" dur="4.8s" repeatCount="indefinite" begin="0.9s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4.8s" repeatCount="indefinite" begin="0.9s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4.8s" repeatCount="indefinite" begin="0.9s" />
    </circle>
    
    <!-- Spark 5 -->
    <circle cx="52" cy="77" r="0.3" fill="#ffb347" opacity="0.8">
      <animate attributeName="cy" values="77;44;24" dur="4.3s" repeatCount="indefinite" begin="1.2s" />
      <animate attributeName="cx" values="52;54;52" dur="4.3s" repeatCount="indefinite" begin="1.2s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4.3s" repeatCount="indefinite" begin="1.2s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4.3s" repeatCount="indefinite" begin="1.2s" />
    </circle>
    
    <!-- Spark 6 -->
    <circle cx="46" cy="74" r="0.3" fill="#ffcc5c" opacity="0.8">
      <animate attributeName="cy" values="74;41;21" dur="4.6s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="cx" values="46;44;46" dur="4.6s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4.6s" repeatCount="indefinite" begin="1.5s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4.6s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    
    <!-- Spark 7 -->
    <circle cx="54" cy="75" r="0.3" fill="#ff6b35" opacity="0.8">
      <animate attributeName="cy" values="75;43;23" dur="4.4s" repeatCount="indefinite" begin="1.8s" />
      <animate attributeName="cx" values="54;56;54" dur="4.4s" repeatCount="indefinite" begin="1.8s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4.4s" repeatCount="indefinite" begin="1.8s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4.4s" repeatCount="indefinite" begin="1.8s" />
    </circle>
    
    <!-- Spark 8 -->
    <circle cx="49" cy="78" r="0.3" fill="#ffb347" opacity="0.8">
      <animate attributeName="cy" values="78;46;26" dur="4.7s" repeatCount="indefinite" begin="2.1s" />
      <animate attributeName="cx" values="49;47;49" dur="4.7s" repeatCount="indefinite" begin="2.1s" />
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4.7s" repeatCount="indefinite" begin="2.1s" />
      <animate attributeName="r" values="0.3;0.1;0.05" dur="4.7s" repeatCount="indefinite" begin="2.1s" />
    </circle>
  </g>
  
  <!-- Ambient warm glow -->
  <g id="glow">
    <ellipse cx="50" cy="65" rx="20" ry="15" fill="url(#fireGradient)" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.15;0.05" dur="8s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="50" cy="60" rx="30" ry="25" fill="url(#fireGradient)" opacity="0.05">
      <animate attributeName="opacity" values="0.02;0.08;0.02" dur="10s" repeatCount="indefinite" />
    </ellipse>
  </g>
  
  <!-- Flickering background elements -->
  <g id="ambient">
    <circle cx="20" cy="20" r="0.5" fill="#ff6b35" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="80" cy="15" r="0.4" fill="#ffb347" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite" begin="1s" />
    </circle>
    <circle cx="15" cy="80" r="0.6" fill="#ffcc5c" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.5s" repeatCount="indefinite" begin="1.5s" />
    </circle>
    <circle cx="85" cy="85" r="0.5" fill="#ff6b35" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5.5s" repeatCount="indefinite" begin="2s" />
    </circle>
    <circle cx="65" cy="30" r="0.4" fill="#ffb347" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.8s" repeatCount="indefinite" begin="2.5s" />
    </circle>
    <circle cx="35" cy="60" r="0.5" fill="#ffcc5c" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5.2s" repeatCount="indefinite" begin="3s" />
    </circle>
  </g>
</svg>