<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Фильтр для эффекта свечения огня -->
    <filter id="fire-glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Радиальный градиент для основного свечения -->
    <radialGradient id="fire-radial" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color: rgba(255, 120, 60, 0.8); stop-opacity: 0.8;" />
      <stop offset="30%" style="stop-color: rgba(255, 100, 40, 0.5); stop-opacity: 0.5;" />
      <stop offset="60%" style="stop-color: rgba(255, 70, 20, 0.2); stop-opacity: 0.2;" />
      <stop offset="100%" style="stop-color: rgba(26, 15, 10, 0); stop-opacity: 0;" />
    </radialGradient>
    
    <!-- Линейный градиент для огня -->
    <linearGradient id="fire-flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color: #ff6b35; stop-opacity: 1;" />
      <stop offset="40%" style="stop-color: #ffb347; stop-opacity: 0.8;" />
      <stop offset="70%" style="stop-color: #ffda6a; stop-opacity: 0.5;" />
      <stop offset="100%" style="stop-color: #ffffff; stop-opacity: 0.1;" />
    </linearGradient>
    
    <!-- Анимации -->
    <style>
      /* Анимация огня */
      .fire-base {
        animation: fire-flicker 3s infinite ease-in-out;
        opacity: 0.7;
      }
      
      @keyframes fire-flicker {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.8; }
      }
      
      /* Анимация искр */
      .ember {
        animation: rise-and-fade 4s infinite ease-in;
        opacity: 0;
      }
      
      @keyframes rise-and-fade {
        0% { 
          transform: translateY(100vh) scale(0.1);
          opacity: 0;
        }
        10% { 
          opacity: 0.8;
        }
        50% { 
          opacity: 0.5;
        }
        90% { 
          opacity: 0.2;
        }
        100% { 
          transform: translateY(-20vh) scale(1);
          opacity: 0;
        }
      }
      
      /* Анимация пульсации свечения */
      .glow-effect {
        animation: glow-pulse 5s infinite ease-in-out;
        opacity: 0.3;
      }
      
      @keyframes glow-pulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.4; }
      }
    </style>
  </defs>
  
  <!-- Основной радиальный градиент для эффекта свечения -->
  <rect width="100%" height="100%" fill="url(#fire-radial)" class="glow-effect" />
  
  <!-- Градиентный фон -->
  <rect width="100%" height="100%">
    <defs>
      <linearGradient id="lounge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1a0f0a;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#2a1810;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1a0f0a;stop-opacity:1" />
      </linearGradient>
    </defs>
    <fill href="#lounge-gradient" />
  </rect>
  
  <!-- Базовое пламя/огонь -->
  <ellipse cx="50" cy="85" rx="25" ry="10" fill="url(#fire-flame)" class="fire-base" style="mix-blend-mode: screen;" />
  <ellipse cx="50" cy="80" rx="20" ry="8" fill="url(#fire-flame)" class="fire-base" style="mix-blend-mode: screen; animation-delay: 0.5s;" />
  <ellipse cx="50" cy="75" rx="15" ry="6" fill="url(#fire-flame)" class="fire-base" style="mix-blend-mode: screen; animation-delay: 1s;" />
  
  <!-- Эффект свечения в центре -->
  <circle cx="50" cy="70" r="30" fill="url(#fire-radial)" class="glow-effect" style="mix-blend-mode: screen;" />
  <circle cx="50" cy="70" r="20" fill="url(#fire-radial)" class="glow-effect" style="mix-blend-mode: screen; opacity: 0.5;" />
  
  <!-- Искры/эмберы -->
  <circle cx="45" cy="100" r="0.3" fill="#ff6b35" class="ember" style="animation-delay: 0s;" filter="url(#fire-glow)" />
  <circle cx="50" cy="100" r="0.2" fill="#ffb347" class="ember" style="animation-delay: 0.5s;" filter="url(#fire-glow)" />
  <circle cx="55" cy="100" r="0.4" fill="#ffda6a" class="ember" style="animation-delay: 1s;" filter="url(#fire-glow)" />
  <circle cx="40" cy="100" r="0.25" fill="#ff6b35" class="ember" style="animation-delay: 1.5s;" filter="url(#fire-glow)" />
  <circle cx="60" cy="100" r="0.3" fill="#ffb347" class="ember" style="animation-delay: 2s;" filter="url(#fire-glow)" />
  <circle cx="48" cy="100" r="0.2" fill="#ffda6a" class="ember" style="animation-delay: 2.5s;" filter="url(#fire-glow)" />
  <circle cx="52" cy="100" r="0.35" fill="#ff6b35" class="ember" style="animation-delay: 3s;" filter="url(#fire-glow)" />
  <circle cx="42" cy="100" r="0.25" fill="#ffb347" class="ember" style="animation-delay: 3.5s;" filter="url(#fire-glow)" />
  <circle cx="58" cy="100" r="0.3" fill="#ffda6a" class="ember" style="animation-delay: 4s;" filter="url(#fire-glow)" />
  <circle cx="46" cy="100" r="0.2" fill="#ff6b35" class="ember" style="animation-delay: 4.5s;" filter="url(#fire-glow)" />
  <circle cx="54" cy="100" r="0.4" fill="#ffb347" class="ember" style="animation-delay: 5s;" filter="url(#fire-glow)" />
  <circle cx="38" cy="100" r="0.2" fill="#ffda6a" class="ember" style="animation-delay: 5.5s;" filter="url(#fire-glow)" />
  <circle cx="62" cy="100" r="0.3" fill="#ff6b35" class="ember" style="animation-delay: 6s;" filter="url(#fire-glow)" />
  <circle cx="44" cy="100" r="0.25" fill="#ffb347" class="ember" style="animation-delay: 6.5s;" filter="url(#fire-glow)" />
  <circle cx="56" cy="100" r="0.3" fill="#ffda6a" class="ember" style="animation-delay: 7s;" filter="url(#fire-glow)" />
  <circle cx="41" cy="100" r="0.2" fill="#ff6b35" class="ember" style="animation-delay: 7.5s;" filter="url(#fire-glow)" />
  <circle cx="59" cy="100" r="0.35" fill="#ffb347" class="ember" style="animation-delay: 8s;" filter="url(#fire-glow)" />
  <circle cx="35" cy="100" r="0.2" fill="#ffda6a" class="ember" style="animation-delay: 8.5s;" filter="url(#fire-glow)" />
  <circle cx="65" cy="100" r="0.25" fill="#ff6b35" class="ember" style="animation-delay: 9s;" filter="url(#fire-glow)" />
  <circle cx="49" cy="100" r="0.3" fill="#ffb347" class="ember" style="animation-delay: 9.5s;" filter="url(#fire-glow)" />
  
  <!-- Дополнительные элементы для атмосферы -->
  <circle cx="30" cy="30" r="2" fill="rgba(255, 107, 53, 0.1)" class="glow-effect" style="animation-duration: 7s;" />
  <circle cx="70" cy="25" r="1.5" fill="rgba(255, 179, 71, 0.15)" class="glow-effect" style="animation-duration: 6s;" />
  <circle cx="20" cy="60" r="1" fill="rgba(255, 218, 106, 0.1)" class="glow-effect" style="animation-duration: 8s;" />
  <circle cx="80" cy="50" r="1.2" fill="rgba(255, 107, 53, 0.1)" class="glow-effect" style="animation-duration: 9s;" />
  <circle cx="60" cy="20" r="0.8" fill="rgba(255, 179, 71, 0.1)" class="glow-effect" style="animation-duration: 10s;" />
</svg>