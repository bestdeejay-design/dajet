name: Generate library.json from albums

on:
  push:
    paths:
      - 'albums/**'
  workflow_dispatch:

# Добавляем разрешения на запись
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate library.json
        run: node .github/scripts/generate-library.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add library.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update library.json"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Используем автоматический токен
